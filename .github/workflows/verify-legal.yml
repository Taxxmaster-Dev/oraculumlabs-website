name: Verify ORACULUM legal pages in all 25 locales

on:
  pull_request:
    branches: [main]
    paths:
      - 'oraculum/**'
      - 'scripts/verify_app_legal.py'
      - '.github/workflows/verify-legal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete Privacy and Terms pages, language and local links
        run: python3 scripts/verify_app_legal.py
